<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Tải 4IELTS</title>
<meta name="description" content="4IELTS – Luyện thi IELTS: biết sai ở đâu, luyện đúng chỗ đó. Tải app trên App Store và Google Play.">
<meta property="og:title" content="Tải 4IELTS – Luyện thi IELTS">
<meta property="og:description" content="Biết sai ở đâu, luyện đúng chỗ đó.">
<meta property="og:image" content="/icon.png">
<meta name="theme-color" content="#1371E2">
<link rel="icon" href="/icon.png">
<link rel="apple-touch-icon" href="/icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Nunito:wght@800;900&display=swap" rel="stylesheet">
<script>
  // Mobile: chuyển thẳng sang store theo thiết bị. Desktop: hiện 2 nút.
  (function () {
    var IOS = 'https://apps.apple.com/vn/app/4ielts-luy%E1%BB%87n-thi-ielts/id6822559887?l=vi';
    var PLAY = 'https://play.google.com/store/apps/details?id=com.eup.migiiielts';
    // Chuyển UTM sang Play Install Referrer để đo nguồn cài đặt trên Android
    var q = window.location.search.replace(/^\?/, '');
    if (q) PLAY += '&referrer=' + encodeURIComponent(q);
    window.STORE = { ios: IOS, play: PLAY };
    if (/[?&]stay=1/.test(window.location.search)) return; // xem trang mà không bị chuyển
    var ua = navigator.userAgent || '';
    var isIOS = /iPhone|iPad|iPod/i.test(ua) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
    var isAndroid = /Android/i.test(ua);
    if (isIOS) window.location.replace(IOS);
    else if (isAndroid) window.location.replace(PLAY);
  })();
</script>
<style>
:root{
  --brand-500:#1371E2; --brand-600:#1167CE; --brand-700:#0D50A0; --brand-50:#EDF4FD; --brand-100:#D3E4FA;
  --text:#212529; --text-2:#495057; --text-3:#868E96; --border:#DEE2E6; --bg:#FFFFFF; --card:#F8F9FA;
  --display:"Nunito","Segoe UI",system-ui,sans-serif; --body:"Inter","Segoe UI",system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){ --text:#F1F3F5; --text-2:#CED4DA; --text-3:#ADB5BD; --border:#343A40; --bg:#0B1220; --card:#151E2E; --brand-50:#12233D; }
}
:root[data-theme="dark"]{ --text:#F1F3F5; --text-2:#CED4DA; --text-3:#ADB5BD; --border:#343A40; --bg:#0B1220; --card:#151E2E; --brand-50:#12233D; }
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:var(--body);color:var(--text);background:var(--bg);-webkit-font-smoothing:antialiased;
  background-image:radial-gradient(ellipse 70% 40% at 50% -5%, rgba(19,113,226,.16), transparent 70%),
                   radial-gradient(ellipse 60% 30% at 50% 105%, rgba(19,113,226,.10), transparent 70%)}
main{min-height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:48px 16px;text-align:center}
.icon{width:104px;height:104px;border-radius:24px;box-shadow:0 14px 34px rgba(19,113,226,.30)}
.wm{margin-top:24px;font-family:var(--display);font-weight:900;font-size:40px;letter-spacing:-.5px;line-height:1}
.wm span{color:var(--brand-500)}
.tag{margin-top:12px;font-family:var(--display);font-weight:800;font-size:19px;color:var(--brand-500)}
.hint{margin-top:28px;font-size:15px;color:var(--text-3)}
.btns{margin-top:16px;width:100%;max-width:360px;display:flex;flex-direction:column;gap:12px}
.btn{display:flex;align-items:center;justify-content:center;gap:12px;height:54px;border-radius:14px;
  font-weight:600;font-size:16px;text-decoration:none;transition:background-color .12s ease,transform .12s ease}
.btn:hover{transform:translateY(-1px)}
.btn:focus-visible{outline:2px solid var(--brand-500);outline-offset:3px}
.primary{background:var(--brand-500);color:#fff;box-shadow:0 8px 20px rgba(19,113,226,.28)}
.primary:hover{background:var(--brand-600)}
.secondary{background:var(--card);color:var(--text);border:1px solid var(--border)}
.secondary:hover{background:var(--brand-50)}
.glyph{width:20px;height:20px;flex:none;background:currentColor;-webkit-mask:var(--m) center/contain no-repeat;mask:var(--m) center/contain no-repeat}
.apple{--m:url("https://cdn.jsdelivr.net/npm/simple-icons@13.0.0/icons/apple.svg")}
.play{width:18px;height:18px;background:url("https://cdn.jsdelivr.net/npm/simple-icons@13.0.0/icons/googleplay.svg") center/contain no-repeat;
  filter:invert(43%) sepia(83%) saturate(1500%) hue-rotate(196deg) brightness(92%)}
footer{margin-top:40px;font-size:13px;color:var(--text-3)}
</style>
</head>
<body>
<main>
  <img class="icon" src="/icon.png" alt="4IELTS" width="104" height="104">
  <h1 class="wm"><span>4</span>IELTS</h1>
  <p class="tag">Biết sai ở đâu, luyện đúng chỗ đó</p>
  <p class="hint">Chọn nền tảng của bạn</p>
  <div class="btns">
    <a class="btn primary" id="ios" href="https://apps.apple.com/vn/app/4ielts-luy%E1%BB%87n-thi-ielts/id6822559887?l=vi"><i class="glyph apple"></i>Tải trên App Store</a>
    <a class="btn secondary" id="play" href="https://play.google.com/store/apps/details?id=com.eup.migiiielts"><i class="play"></i>Tải trên Google Play</a>
  </div>
  <footer>© 4IELTS · eUp Group</footer>
</main>
<script>
  document.getElementById('play').href = window.STORE.play;
</script>
</body>
</html>
